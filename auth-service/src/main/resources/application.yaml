server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: sunuhelp
    password: ${DB_PASSWORD:sunuhelp_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: auth-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Proprietes propres a auth-service, liees via @ConfigurationProperties
# (classes JwtProperties / OtpProperties a creer dans le package config)
app:
  jwt:
    secret: ${JWT_SECRET:changeme-dev-secret-a-remplacer-en-production-0123456789}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30
  otp:
    expiration-minutes: 5
    max-attempts: 3

logging:
  level:
    com.sunuhelp: DEBUG
