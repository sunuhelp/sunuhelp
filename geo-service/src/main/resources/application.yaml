server:
  port: 8087

spring:
  application:
    name: geo-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/geo_db}
    username: sunuhelp
    password: ${DB_PASSWORD:sunuhelp_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:changeme-dev-secret-a-remplacer-en-production-0123456789}

logging:
  level:
    com.sunuhelp: DEBUG
