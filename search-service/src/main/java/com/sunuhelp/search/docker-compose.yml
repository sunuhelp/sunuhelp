name: sunuhelp

services:

  auth-db:
    image: postgres:16-alpine
    container_name: sunuhelp-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: sunuhelp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sunuhelp_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunuhelp -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  category-db:
    image: postgres:16-alpine
    container_name: sunuhelp-category-db
    environment:
      POSTGRES_DB: category_db
      POSTGRES_USER: sunuhelp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sunuhelp_dev_password}
    ports:
      - "5434:5432"
    volumes:
      - category_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunuhelp -d category_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  entity-db:
    image: postgres:16-alpine
    container_name: sunuhelp-entity-db
    environment:
      POSTGRES_DB: entity_db
      POSTGRES_USER: sunuhelp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sunuhelp_dev_password}
    ports:
      - "5435:5432"
    volumes:
      - entity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunuhelp -d entity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  review-db:
    image: postgres:16-alpine
    container_name: sunuhelp-review-db
    environment:
      POSTGRES_DB: review_db
      POSTGRES_USER: sunuhelp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sunuhelp_dev_password}
    ports:
      - "5436:5432"
    volumes:
      - review_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunuhelp -d review_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16-alpine
    container_name: sunuhelp-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: sunuhelp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sunuhelp_dev_password}
    ports:
      - "5437:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunuhelp -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: sunuhelp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sunuhelp-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: sunuhelp-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  auth_db_data:
  category_db_data:
  entity_db_data:
  review_db_data:
  user_db_data:
  elasticsearch_data:
